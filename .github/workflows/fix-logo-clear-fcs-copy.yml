name: Fix logo clear FCS and copy

on:
  push:
    branches:
      - fix/logo-clear-fcs-copy-2026-09-03

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated source fixes
        run: node scripts/fix-logo-clear-fcs-copy-v3.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run stable and focused logic tests
        run: node --test tests/cardOrdering.test.ts tests/confidencePoints.test.ts tests/lockRules.test.ts tests/notificationCounts.test.ts tests/settlementMath.test.ts tests/sideBetLimits.test.ts tests/weeklyBank.test.ts tests/fcsDisplayAndMatching.test.ts

      - name: Build
        run: npm run build

      - name: Remove one-time tooling
        run: rm -f scripts/fix-logo-clear-fcs-copy.mjs scripts/fix-logo-clear-fcs-copy-v2.mjs scripts/fix-logo-clear-fcs-copy-v3.mjs .github/workflows/fix-logo-clear-fcs-copy.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix initial logo readiness side bet actions and FCS matching"
          git push origin HEAD:fix/logo-clear-fcs-copy-2026-09-03
