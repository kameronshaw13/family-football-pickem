name: Restore mobile spread size

on:
  push:
    branches:
      - fix/restore-mobile-spread-size
    paths:
      - .github/workflows/restore-mobile-spread-size.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap mobile spread size restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-mobile-spread-size
          fetch-depth: 0
      - name: Restore responsive spread sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/final-polish.css')
          text = path.read_text()
          old = '''/* Preserve the existing right-side market geometry explicitly. Team names on
   the left are also 16px, so spread and team text remain intentionally matched. */
.team-spread,
.team-board-market {
  font-size: 16px;
  white-space: nowrap;
}
'''
          new = '''/* Preserve right-side market wrapping without overriding the shared responsive
   sizing: team names and markets are 16px by default and 15px on mobile. */
.team-spread,
.team-board-market {
  white-space: nowrap;
}
'''
          if old not in text:
              raise SystemExit('spread override block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci
          git diff --check
          npm test
          npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/restore-mobile-spread-size.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app/final-polish.css .github/workflows/restore-mobile-spread-size.yml
          git commit -m "Restore mobile spread text to 15px"
          git push origin HEAD:fix/restore-mobile-spread-size
