name: Restore future locked styling

on:
  push:
    branches:
      - fix/locked-board-dropdown-preview-cleanup
    paths:
      - .github/workflows/restore-future-locked-style.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'Restore future locked styling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/locked-board-dropdown-preview-cleanup
          fetch-depth: 0
      - name: Restore unopened-week styling only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          globals_path = Path('app/globals.css')
          globals_text = globals_path.read_text()
          old_css = '.side-bet-game-card.closed .team-row { color: var(--muted); background: var(--canvas-muted); -webkit-text-fill-color: var(--muted); }'
          new_css = '.game-card.locked-out .team-row, .side-bet-game-card.closed .team-row { color: var(--muted); background: var(--canvas-muted); -webkit-text-fill-color: var(--muted); }'
          if old_css not in globals_text:
              raise SystemExit('expected locked css not found')
          globals_path.write_text(globals_text.replace(old_css, new_css, 1))

          app = Path('components/PickemApp.tsx')
          text = app.read_text()
          old = ' ${closed ? "closed" : ""} ${existingMatchesView ? "selected" : ""}'
          new = ' ${closed ? "closed" : ""} ${!weekIsOpen && !gameIsLive && !gameIsFinal ? "locked-out" : ""} ${existingMatchesView ? "selected" : ""}'
          if old not in text:
              raise SystemExit('expected GameCard class sequence not found')
          app.write_text(text.replace(old, new, 1))
          PY
          npm ci
          git diff --check
          npm test
          npm run build
      - name: Commit restored behavior
        shell: bash
        run: |
          rm -f .github/workflows/restore-future-locked-style.yml .github/workflows/locked-board-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app/globals.css components/PickemApp.tsx .github/workflows/restore-future-locked-style.yml .github/workflows/locked-board-cleanup.yml
          git commit -m "Preserve future-week locked styling"
          git push origin HEAD:fix/locked-board-dropdown-preview-cleanup
