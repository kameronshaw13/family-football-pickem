name: Restore clean features

on:
  push:
    branches:
      - restore-clean-features-2026-09-03

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep generated rule lookup null-safe
        run: sed -i 's/data\.sideBetSettings/data?.sideBetSettings/g; s/data\.sideBetSlotCounts/data?.sideBetSlotCounts/g' scripts/restore-clean-features.mjs

      - name: Apply isolated feature restores
        run: node scripts/restore-clean-features.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run stable logic tests
        run: node --test tests/cardOrdering.test.ts tests/confidencePoints.test.ts tests/lockRules.test.ts tests/notificationCounts.test.ts tests/settlementMath.test.ts tests/sideBetLimits.test.ts tests/weeklyBank.test.ts

      - name: Build
        run: npm run build

      - name: Remove one-time tooling
        run: rm -f scripts/restore-clean-features.mjs .github/workflows/restore-clean-features.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore isolated rules and data features"
          git push origin HEAD:restore-clean-features-2026-09-03
