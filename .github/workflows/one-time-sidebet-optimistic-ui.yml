name: One-time side bet optimistic UI

on:
  push:
    branches:
      - sidebet-optimistic-ui-2026-09-03
    paths:
      - .github/workflows/one-time-sidebet-optimistic-ui.yml
      - .github/scripts/sidebet_optimistic_ui.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout sidebet-optimistic-ui-2026-09-03
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply refactor
        run: |
          cd repo
          python .github/scripts/sidebet_optimistic_ui.py
          git diff --check -- components/PickemAppBase.tsx

      - name: Commit source only
        run: |
          cd repo
          rm .github/scripts/sidebet_optimistic_ui.py
          rm .github/workflows/one-time-sidebet-optimistic-ui.yml
          git add -A
          git diff --cached --check
          git commit -m "Make side bet responses optimistic and local"
          git push origin sidebet-optimistic-ui-2026-09-03
