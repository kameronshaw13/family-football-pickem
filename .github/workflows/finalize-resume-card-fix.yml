name: Finalize resume card fix

on:
  push:
    branches:
      - fix/live-outcomes-resume-card-geometry
    paths:
      - .github/workflows/finalize-resume-card-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize final-only pick grading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-outcomes-resume-card-geometry
          fetch-depth: 0
      - name: Make grading final-only and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/PickemApp.tsx')
          text = path.read_text()
          old = 'if (!existingMatchesView || !existing || !hasScore || awayScore == null || homeScore == null) return null;'
          new = 'if (!existingMatchesView || !existing || !gameIsFinal || awayScore == null || homeScore == null) return null;'
          if old not in text:
              raise SystemExit('expected live grading condition not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npm ci
          git diff --check
          npm test
          npm run build
      - name: Commit final-only behavior
        shell: bash
        run: |
          rm -f .github/workflows/fix-resume-live-card.yml .github/workflows/retry-resume-live-card.yml .github/workflows/finalize-resume-card-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- components/PickemApp.tsx .github/workflows/fix-resume-live-card.yml .github/workflows/retry-resume-live-card.yml .github/workflows/finalize-resume-card-fix.yml
          git commit -m "Keep pick outcome colors final-only"
          git push origin HEAD:fix/live-outcomes-resume-card-geometry
