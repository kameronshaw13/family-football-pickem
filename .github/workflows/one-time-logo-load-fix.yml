name: One-time logo loading source fix

on:
  push:
    branches: [logo-load-root-fix-2026-09-03]
    paths:
      - '.github/workflows/one-time-logo-load-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch logo-load-root-fix-2026-09-03 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Update TeamLogo at source
        run: |
          cd repo
          python - <<'PY'
          from pathlib import Path
          path = Path('components/PickemAppBase.tsx')
          text = path.read_text()
          old = 'if (url) return <img src={url} alt="" className={classes} width={34} height={34} loading="eager" decoding="sync" />;'
          new = 'if (url) return <img src={url} alt="" className={classes} width={34} height={34} loading="lazy" decoding="async" />;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one TeamLogo image owner, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/one-time-logo-load-fix.yml

      - name: Commit clean source change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PickemAppBase.tsx
          git diff --cached --check
          git commit -m "Load offscreen team logos asynchronously"
          git push origin HEAD:logo-load-root-fix-2026-09-03
