name: Retry resume live-card fix

on:
  push:
    branches:
      - fix/live-outcomes-resume-card-geometry
    paths:
      - .github/workflows/retry-resume-live-card.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry resume live-card fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-outcomes-resume-card-geometry
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          text = text.replace('import ShawResumeErrorGuard from "@/components/ShawResumeErrorGuard";\n', '')
          text = text.replace('<RouteAppBootstrap slug="shaw-family" /><ShawResumeErrorGuard /><PickemApp appSlug="shaw-family" />', '<RouteAppBootstrap slug="shaw-family" /><PickemApp appSlug="shaw-family" />')
          page.write_text(text)

          app = Path('components/PickemApp.tsx')
          text = app.read_text()
          text = text.replace('const APP_DATA_CACHE_MAX_AGE = 10 * 60 * 1000;', 'const APP_DATA_CACHE_MAX_AGE = 24 * 60 * 60 * 1000;')

          old_fetch = '''      const response = await fetch(url.toString(), { headers: { Authorization: `Bearer ${token}`, "x-pickem-group": appSlug }, cache: "no-store" });\n      const payload = await response.json();'''
          new_fetch = '''      let response: Response | null = null;\n      let lastError: unknown = null;\n      for (let attempt = 0; attempt < 3; attempt += 1) {\n        try {\n          response = await fetch(url.toString(), { headers: { Authorization: `Bearer ${token}`, "x-pickem-group": appSlug }, cache: "no-store" });\n          break;\n        } catch (error) {\n          lastError = error;\n          if (attempt < 2) await new Promise((resolve) => window.setTimeout(resolve, 250 * (attempt + 1)));\n        }\n      }\n      if (!response) throw lastError || new Error("Could not load app data.");\n      const payload = await response.json();'''
          if old_fetch not in text:
              raise SystemExit('app-data fetch block not found')
          text = text.replace(old_fetch, new_fetch, 1)

          old_result = '''  function pickedResult(): GameOutcome | null {\n    if (!existingMatchesView || !existing || !gameIsFinal || awayScore == null || homeScore == null) return null;\n    if (existing.result !== "pending") return existing.result;\n    if (existing.pick_type === "underdog") {\n      return gradeUnderdogOutright(existing.selected_team, game.home_team, game.away_team, homeScore, awayScore);\n    }\n    const spread = existing.locked_spread ?? normalizeSpreadForSelectedTeam(existing.selected_team, game.current_spread_team, game.current_spread);\n    return spread == null ? null : gradeAgainstSpread(existing.selected_team, game.home_team, game.away_team, homeScore, awayScore, spread);\n  }\n\n  function resultWithoutPick(team: string): GameOutcome | null {'''
          new_result = '''  function pickedResult(): GameOutcome | null {\n    if (!existingMatchesView || !existing || !hasScore || awayScore == null || homeScore == null) return null;\n    if (gameIsFinal && existing.result !== "pending") return existing.result;\n    if (existing.pick_type === "underdog") {\n      return gradeUnderdogOutright(existing.selected_team, game.home_team, game.away_team, homeScore, awayScore);\n    }\n    const spread = existing.locked_spread ?? normalizeSpreadForSelectedTeam(existing.selected_team, game.current_spread_team, game.current_spread);\n    return spread == null ? null : gradeAgainstSpread(existing.selected_team, game.home_team, game.away_team, homeScore, awayScore, spread);\n  }\n\n  function resultWithoutPick(team: string): GameOutcome | null {'''
          if old_result not in text:
              raise SystemExit('pickedResult block not found')
          text = text.replace(old_result, new_result, 1)

          old_classes = '''  const finalPickResult = pickedResult();\n  function finalResultForTeam(team: string): GameOutcome | null {\n    if (!gameIsFinal) return null;\n    if (!existingMatchesView || !existing || !finalPickResult) return resultWithoutPick(team);\n    if (finalPickResult === "push") return "push";\n    if (team === existing.selected_team) return finalPickResult;\n    return finalPickResult === "win" ? "loss" : "win";\n  }\n\n  function resultClasses(team: string) {\n    const classes: string[] = [];\n    const outcome = finalResultForTeam(team);\n    if (outcome) classes.push(`outcome-${outcome}`);\n    if (existingMatchesView && existing?.selected_team === team && finalPickResult) {\n      classes.push(`picked-${finalPickResult}`);\n    }\n    return classes.join(" ");\n  }'''
          new_classes = '''  const pickedScoreResult = pickedResult();\n  function finalResultForTeam(team: string): GameOutcome | null {\n    if (!gameIsFinal) return null;\n    if (!existingMatchesView || !existing || !pickedScoreResult) return resultWithoutPick(team);\n    if (pickedScoreResult === "push") return "push";\n    if (team === existing.selected_team) return pickedScoreResult;\n    return pickedScoreResult === "win" ? "loss" : "win";\n  }\n\n  function resultClasses(team: string) {\n    const classes: string[] = [];\n    const finalOutcome = finalResultForTeam(team);\n    if (finalOutcome) classes.push(`outcome-${finalOutcome}`);\n    if (existingMatchesView && existing?.selected_team === team && pickedScoreResult) {\n      classes.push(`picked-${pickedScoreResult}`);\n    }\n    return classes.join(" ");\n  }'''
          if old_classes not in text:
              raise SystemExit('resultClasses block not found')
          text = text.replace(old_classes, new_classes, 1)
          app.write_text(text)

          css = Path('app/final-polish.css')
          style = css.read_text()
          style += '''\n\n/* Real and preview Pick Board use the same score-based selected-side treatment. */\n.picks-panel .stacked-matchup .team-row.picked-win {\n  background: linear-gradient(var(--green), var(--green)) left top / 4px 100% no-repeat, var(--win-soft);\n}\n.picks-panel .stacked-matchup .team-row.picked-loss {\n  background: linear-gradient(var(--red), var(--red)) left top / 4px 100% no-repeat, var(--red-soft);\n}\n.picks-panel .stacked-matchup .team-row.picked-push {\n  background: linear-gradient(var(--line-strong), var(--line-strong)) left top / 4px 100% no-repeat, var(--surface-muted);\n}\n\n/* My Card and League Cards share the same first-row origin and row measurements. */\n.card-panel > .pick-section { margin-top: 0; }\n.pick-top, .visible-pick {\n  grid-template-columns: var(--card-logo-column) minmax(0, 1fr) max-content;\n  column-gap: var(--card-logo-gap);\n}\n.pick-row-actions, .visible-pick-actions { align-self: center; }\n'''
          css.write_text(style)
          PY

          rm -f components/ShawResumeErrorGuard.tsx
          npm ci
          git diff --check
          npm test
          npm run build
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app/page.tsx components/PickemApp.tsx app/final-polish.css components/ShawResumeErrorGuard.tsx
          git commit -m "Fix resume loading and shared live pick states"
          git push origin HEAD:fix/live-outcomes-resume-card-geometry
